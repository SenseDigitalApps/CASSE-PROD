name: c_a_s_s_e_seguros
description: CASSE Seguros mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  auto_size_text: 3.0.0
  cached_network_image: 3.4.1
  collection: ^1.19.0
  cupertino_icons: 1.0.8
  dropdown_button2: 2.3.9
  equatable: 2.0.7
  file_saver: 0.2.14
  flutter_animate: 4.5.0
  font_awesome_flutter: 10.7.0
  from_css_color: 2.0.0
  go_router: 12.1.3
  google_fonts: 6.1.0
  http: 1.4.0
  intl: 0.20.2
  json_path: 0.7.2
  mask_text_input_formatter: 2.9.0
  mime_type: 1.0.0
  page_transition: 2.1.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  provider: 6.1.5
  shared_preferences: 2.5.3
  sqflite: 2.3.3+1
  timeago: 3.7.1
  url_launcher: 6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  lints: 4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/
